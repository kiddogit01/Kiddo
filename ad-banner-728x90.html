<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pub AdSterra 728x90 (flottante)</title>
<style>
html,body{margin:0;height:100%;background:transparent!important;scrollbar-width:none}
html{overflow:auto}body{overflow:visible}
::-webkit-scrollbar{display:none}
#stage{position:relative;width:100%;height:100%}
#float{position:absolute;right:20px;bottom:24px}
</style>
</head>
<body>
<div id="stage"><div id="float">
<div id="box" style="overflow:hidden"><div id="w" style="width:728px;height:90px;transform-origin:left top">
<script type="text/javascript">
atOptions={'key':'015d3a159fdea00a6a1171241f02036e','format':'iframe','height':90,'width':728,'params':{}};
</script>
<script src="https://www.highrevenueformat.com/015d3a159fdea00a6a1171241f02036e/invoke.js"></script>
</div></div>
</div></div>
<script>
// ---- Réglage (ou dans l'URL : ?pos=top-left|top-right|bottom-left|bottom-right) ----
var Q=new URLSearchParams(location.search), POS=(Q.get('pos')||'bottom-right').split('-');
var MX=20, MY=24;   // marges comme le bouton Kiddo Services
var NAT=[728,90];   // taille naturelle [l, h] de la pub (null = mesurée)
var stage=document.getElementById('stage'), fl=document.getElementById('float');

// Position fixe ancrée à un coin (non déplaçable) : reste collée au coin quand la hauteur de la WebView change
function place(h,v,ox,oy){ var s=fl.style; s.left=s.right=s.top=s.bottom='auto'; s[h]=ox+'px'; s[v]=oy+'px'; }
place(POS[1]==='left'?'left':'right', POS[0]==='top'?'top':'bottom', MX, MY);

// 728x90 : réduite selon la LARGEUR uniquement (stable quand on change la hauteur)
function fit(){var s=Math.min(1,(innerWidth-2*MX)/728),b=document.getElementById('box');
document.getElementById('w').style.transform='scale('+s+')';b.style.width=(728*s)+'px';b.style.height=(90*s)+'px';}
fit();addEventListener('resize',function(){fit();sizeStage();});
// La page défile si la WebView est plus petite que la pub (jamais de réduction par la hauteur)
function sizeStage(){ stage.style.minWidth=(fl.offsetWidth+2*MX)+'px'; stage.style.minHeight=(fl.offsetHeight+2*MY)+'px'; }
var lw=0,lh=0;
function report(){ try{ if(!(window.AndroidBridge&&AndroidBridge.onBannerSize)) return;
  var w=NAT?NAT[0]+2*MX:fl.offsetWidth+2*MX, h=NAT?NAT[1]+2*MY:fl.offsetHeight+2*MY;
  if(w===lw&&h===lh) return; lw=w; lh=h; AndroidBridge.onBannerSize(w,h); }catch(e){} }
function update(){ sizeStage(); report(); }
if(window.ResizeObserver) new ResizeObserver(update).observe(fl);
addEventListener('load',update); update();

</script>
</body>
</html>
