<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pub AdSterra Native Banner (flottante)</title>
<style>
html,body{margin:0;height:100%;background:transparent!important;overflow:hidden}
/* La bannière elle-même flotte, comme le bouton Kiddo Services de l'index */
#float{position:fixed;right:20px;bottom:calc(24px + env(safe-area-inset-bottom));z-index:400;border-radius:14px;overflow:hidden;
 box-shadow:0 6px 24px rgba(0,0,0,.45);animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 6px 24px rgba(0,0,0,.45),0 0 0 0 rgba(41,193,255,.45)}50%{box-shadow:0 6px 24px rgba(0,0,0,.45),0 0 0 9px rgba(41,193,255,0)}}
</style>
</head>
<body>
<div id="float">
<div style="width:min(320px,calc(100vw - 40px));max-height:calc(100vh - 48px)">
<script async="async" data-cfasync="false" src="https://pl31437230.profitableratecpmnetwork.com/e175405a295d5260b702739bb32ab910/invoke.js"></script>
<div id="container-e175405a295d5260b702739bb32ab910"></div>
</div>
</div>
<script>
var fl=document.getElementById('float');
/* taille native gérée par la régie */
// Taille de la bannière envoyée à l'app (pour ajuster la WebView) : AndroidBridge.onBannerSize(largeur, hauteur) en px CSS
function report(){ try{ var r=fl.getBoundingClientRect();
  if(window.AndroidBridge && AndroidBridge.onBannerSize) AndroidBridge.onBannerSize(Math.ceil(r.width+40), Math.ceil(r.height+48)); }catch(e){} }
if(window.ResizeObserver) new ResizeObserver(report).observe(fl);
addEventListener('load',report); addEventListener('resize',report);
</script>
</body>
</html>
